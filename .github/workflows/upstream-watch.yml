name: BatteryHub release watch

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/upstream-version
          sparse-checkout-cone-mode: false

      - name: Open an issue for a newer BatteryHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: krisgfx9/Wireless-Device-Battery-Monitor
        run: |
          set -euo pipefail
          merged=$(tr -d '[:space:]' < .github/upstream-version)
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$merged" =~ $version_pattern ]]; then
            echo "::error::.github/upstream-version must contain a stable version tag."
            exit 1
          fi

          if result=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name' 2>&1); then
            latest=$result
          elif [[ "$result" == *"(HTTP 404)"* ]]; then
            echo "::warning::BatteryHub's GitHub releases are unavailable (HTTP 404). The last merged tag is $merged."
            exit 0
          else
            echo "::error::Could not read BatteryHub's latest release. Check the upstream status and GitHub Actions token."
            exit 1
          fi

          if [[ ! "$latest" =~ $version_pattern ]]; then
            echo "::warning::BatteryHub's latest tag is not a stable version tag."
            exit 0
          fi
          echo "Last merged: $merged. BatteryHub's latest release: $latest."
          [[ "$latest" != "$merged" ]] || exit 0
          newest=$(printf '%s\n%s\n' "${merged#v}" "${latest#v}" | sort -V | tail -n 1)
          [[ "$newest" == "${latest#v}" ]] || exit 0

          title="BatteryHub $latest released upstream"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --json title --jq '.[].title')
          if grep -Fxq "$title" <<< "$existing"; then
            echo "Already reported."
            exit 0
          fi
          url="https://github.com/$UPSTREAM/releases/tag/$latest"
          body=$(printf 'BatteryHub **%s** is out: %s\n\nThis fork last merged **%s**. Review the upstream changes and CONTRIBUTING.md before bringing them in. After merging and verifying the update, set .github/upstream-version to %s and close this issue.' "$latest" "$url" "$merged" "$latest")
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
